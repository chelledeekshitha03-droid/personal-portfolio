
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search for a city and view current weather conditions.">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="weather.css">
    <script src="weather.js" defer></script>
</head>
<body>
    <main class="dashboard">
        <a href="index.html" class="back-link">← Back to Portfolio</a>

        <header class="page-header">
            <p class="eyebrow">WEATHER APP</p>
            <h1>Weather Dashboard</h1>
            <p>Find current weather conditions for any city.</p>
        </header>

        <form id="search-form">
            <label for="city-input">Enter a city name</label>
            <div class="search-row">
                <input
                    type="text"
                    id="city-input"
                    placeholder="e.g. Vijayawada"
                    maxlength="100"
                    required
                >
                <button type="submit" id="search-button">Search</button>
            </div>
        </form>

        <p id="status" role="status" aria-live="polite">
            Enter a city to check its weather.
        </p>

        <section id="weather-panel" aria-labelledby="city-name" hidden>
            <div class="weather-heading">
                <div>
                    <h2 id="city-name"></h2>
                    <p id="weather-description"></p>
                    <p id="local-time"></p>
                </div>
                <span id="weather-icon" class="weather-icon" aria-hidden="true">🌤️</span>
            </div>

            <div class="temperature">
                <span id="temperature">--</span><span>°C</span>
            </div>
            <p id="feels-like"></p>

            <div class="metrics">
                <article class="metric">
                    <span aria-hidden="true">💧</span>
                    <h3>Humidity</h3>
                    <p><span id="humidity">--</span>%</p>
                </article>

                <article class="metric">
                    <span aria-hidden="true">💨</span>
                    <h3>Wind Speed</h3>
                    <p><span id="wind-speed">--</span> km/h</p>
                </article>

                <article class="metric">
                    <span aria-hidden="true">🌧️</span>
                    <h3>Precipitation</h3>
                    <p><span id="precipitation">--</span> mm</p>
                </article>
            </div>

            <p class="source">
                Weather data: Open-Meteo
            </p>
        </section>
    </main>
</body>
</html>
