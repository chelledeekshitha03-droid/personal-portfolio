<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Your Name for web development and collaboration opportunities.">

    <meta name="keywords"
          content="contact, web developer, portfolio">

    <meta name="author" content="Your Name">

    <meta name="robots" content="index, follow">

    <title>Contact | Your Name</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <header>

        <div class="container">

            <h1>Your Name</h1>

            <nav aria-label="Main navigation">

                <ul>

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="projects.html">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="contact.html" aria-current="page">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <main id="main-content">

        <div class="container">

            <header>

                <h2>Contact Me</h2>

                <p>
                    Feel free to send me a message.
                </p>

            </header>

            <section aria-labelledby="contact-form-heading">

                <h3 id="contact-form-heading">
                    Contact Form
                </h3>

                <form action="#" method="post">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-required="true"
                        >

                    </div>

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-required="true"
                        >

                    </div>

                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                            aria-required="true"
                        >

                    </div>

                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                            aria-required="true"
                        ></textarea>

                    </div>

                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </section>

        </div>

    </main>

    <footer>

        <div class="container">

            <p>
                &copy; 2026 Your Name. All rights reserved.
            </p>

        </div>

    </footer>

</body>

</html>
