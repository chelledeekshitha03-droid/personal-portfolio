
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive to-do list app built with JavaScript.">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="todo.css">
    <script src="todo.js" defer></script>
</head>
<body>
    <main class="app">
        <a href="index.html">← Back to Portfolio</a>
        <h1>My To-Do List</h1>
        <p>Organize your tasks and track your progress.</p>

        <form id="task-form">
            <label for="task-input">New task</label>
            <div class="input-row">
                <input id="task-input" type="text"
                       placeholder="Enter a task..." required maxlength="200">
                <button type="submit">Add Task</button>
            </div>
        </form>

        <p id="task-count" aria-live="polite">0 tasks</p>

        <div class="filters" aria-label="Filter tasks">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <ul id="task-list" aria-label="Tasks"></ul>
        <p id="empty-message">No tasks yet. Add your first task!</p>
    </main>
</body>
</html>
